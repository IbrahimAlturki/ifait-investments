name: Update prices

on:
  schedule:
    # 13:10 UTC = 16:10 Riyadh, just after the Tadawul close, Sunday–Thursday.
    - cron: "10 13 * * 0-4"
    # And once more after the US close, so SPUS/GLD/SPRE reflect the full day.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prices
        run: node fetch-prices.mjs

      - name: Commit prices.json
        run: |
          git config user.name  "price-bot"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Prices $(date -u +'%F %H:%M')"
          git push
